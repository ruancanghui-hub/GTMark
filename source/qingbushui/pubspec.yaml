name: qingbushui
description: "轻补水 — 智能补水追踪 App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_modular: ^6.4.1
  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/qw_crystal/generated_icons/
    - assets/qw_crystal/generated_sources/
    - assets/qw_crystal/source/
