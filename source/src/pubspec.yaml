name: lianji
description: "吉辰万年历 — 查日期 · 择吉 · 提醒 · 发祝福"
publish_to: 'none'

version: 1.3.6+136

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_modular: ^6.4.1
  get: ^4.7.2
  shared_preferences: ^2.5.3
  synchronized: ^3.1.0
  intl: ^0.20.2
  lunar: ^1.7.8
  tdesign_flutter: ^0.2.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_markdown: ^0.7.7+1
  share_plus: ^11.1.0
  path_provider: ^2.1.5
  gal: ^2.3.1
  cupertino_icons: ^1.0.8
  characters: ^1.4.0
  http: ^1.2.2
  flutter_local_notifications: ^19.0.0
  permission_handler: ^11.4.0
  timezone: ^0.10.0
  geolocator: ^13.0.2
  file_picker: ^11.0.2
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  supabase_flutter: ^2.15.0
  hugeicons: ^1.1.7
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  objective_c: 9.4.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/brand/
    - assets/images/zj/
    - assets/legal/
    - assets/content/
